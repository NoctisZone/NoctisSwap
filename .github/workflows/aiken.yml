name: Aiken

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  aiken:
    name: Aiken — venue contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned Aiken version from aiken.toml
        id: aiken-version
        run: |
          version="$(grep -E '^compiler[[:space:]]*=' aiken.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$version" ]; then
            echo "Could not read the compiler pin from aiken.toml" >&2
            exit 1
          fi
          echo "Using Aiken $version (from aiken.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: aiken-lang/setup-aiken@v1
        with:
          version: ${{ steps.aiken-version.outputs.version }}

      - name: Confirm the installed toolchain matches the pin
        run: aiken --version

      - name: aiken fmt --check
        run: aiken fmt --check

      - name: aiken check
        run: aiken check

      - name: aiken build (regenerates plutus.json)
        run: aiken build

      - name: plutus.json must be current
        run: |
          if ! git diff --exit-code -- plutus.json; then
            echo ""
            echo "::error file=plutus.json::plutus.json is out of date with the .ak sources."
            echo "A validator changed but the compiled blueprint was not regenerated."
            echo "Fix: run 'aiken build' and commit the updated plutus.json."
            echo "A hash is an address: every script address, every reference script and"
            echo "every applied-parameter chain derives from these bytes."
            exit 1
          fi
          echo "plutus.json matches a fresh build of the current .ak sources."

      - name: Upload the freshly built blueprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plutus-json
          path: plutus.json
          if-no-files-found: warn
